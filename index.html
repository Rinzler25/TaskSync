<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://img.icons8.com/ios-filled/50/2c3e50/shield.png" alt="Escudo">
            <span>TaskSync</span>
        </div>
        <ul class="nav-links">
            <li>Proyectos</li>
            <li>Tareas</li>
            <li>Mi Equipo</li>
            <li>Reportes</li>
        </ul>
        <div class="user-icons">
            <i class="icon-user"></i>
            <i class="icon-bell"></i>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content">
            <!-- Imagen central del escudo con el reloj -->
            <div class="shield-container">
                <img src="https://img.icons8.com/illustrations/external-pack-v-2-lineal-color-pack-v-2/500/external-Project-Management-business-pack-v-2-lineal-color-pack-v-2.png" alt="Organización Shield">
            </div>
            <div class="hero-actions">
                <button class="btn-primary">Empieza Gratis</button>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <!-- SECCIÓN 1: DASHBOARD -->
        <div id="vista-dashboard">
            <section class="hero">
                <h1>¡Toma Control de tu Tiempo!</h1>
                <button class="btn-start">Empieza Gratis</button>
            </section>

            <div class="main-container">
                <!-- Columna Izquierda -->
                <div class="column-projects">
                    <div class="section-header">
                        <h2>Mis Proyectos</h2>
                        <button class="btn-action" onclick="abrirModal('proyecto')">+ Nuevo Proyecto</button>
                    </div>
                    <div id="project-grid" class="project-grid"></div>
                </div>

                <!-- Columna Derecha -->
                <div class="column-tasks">
                    <div class="section-header">
                        <h2>Tareas del Día</h2>
                        <button class="btn-action" onclick="abrirModal('tarea')">+ Nueva Tarea</button>
                    </div>
                    <div id="quick-tasks-container" class="project-grid"></div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: HISTORIAL -->
        <div id="vista-historial" style="display: none;">
            <section class="content">
                <div class="section-header">
                    <h2>Historial de Éxitos</h2>
                    <p>Repaso de tus proyectos y tareas terminadas.</p>
                </div>
                <div id="history-grid" class="project-grid"></div>
            </section>
        </div>

        <!-- MODAL ÚNICO CORREGIDO -->
        <div id="modalGenerico" class="modal">
            <div class="modal-content">
                <h3 id="tituloModal">Nueva Entrada</h3>
                <input type="text" id="nombreEntrada" placeholder="Nombre...">
                <label>Fecha de Entrega:</label>
                <input type="date" id="fechaEntregaEntrada">
                <div class="modal-actions">
                    <button onclick="cerrarModal()">Cancelar</button>
                    <button class="btn-start" id="btnGuardar">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
