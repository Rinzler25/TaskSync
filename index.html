<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync - Gestión Universitaria</title>
    <link rel="stylesheet" href="style.css?v=1.0.1">
    <script src="script.js?v=1.0.1"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="showView('home-view')" style="cursor:pointer">
                <img src="assets/logo.png" alt="TaskSync Logo">
                <span>TaskSync</span>
            </div>
            <ul class="nav-menu">
                <li onclick="filterContent('proyecto')">Proyectos</li>
                <li onclick="filterContent('tarea')">Tareas</li>
            </ul>
            <div class="nav-icons">
                <div class="icon-circle">👤</div>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero">
        <div class="hero-image-container">
            <img src="assets/hero.jpeg" alt="TaskSync Central" class="hero-main-img">
        </div>
    </header>

    <main class="main-content">
        
        <!-- VISTA PRINCIPAL -->
        <section id="home-view" class="view active">
            <div class="services-grid">
                <div class="service-card" onclick="showView('history-view')">
                    <img src="assets/bloques.png" alt="Historial">
                    <h3>Historial</h3>
                    <p>Revisa tus actividades finalizadas.</p>
                </div>
                <div class="service-card" onclick="showView('status-view')">
                    <img src="assets/reloj.png" alt="Estado">
                    <h3>Estado de Avance</h3>
                    <p>Barras de progreso en tiempo real.</p>
                </div>
                <div class="service-card" onclick="showView('calendar-view')">
                    <img src="assets/carpeta.png" alt="Calendario">
                    <h3>Calendario</h3>
                    <p>Organiza tus entregas del mes.</p>
                </div>
            </div>
        </section>

        <!-- VISTA: ESTADO DE AVANCE -->
        <section id="status-view" class="view">
            <div class="section-header">
                <button class="btn-back" onclick="showView('home-view')">← Volver</button>
                <h2 id="status-title">Actividades en Curso</h2>
            </div>
            <div id="active-projects-list" class="list-container"></div>
        </section>

        <!-- VISTA: HISTORIAL -->
        <section id="history-view" class="view">
            <button class="btn-back" onclick="showView('home-view')">← Volver</button>
            <h2>Historial de Finalizados</h2>
            <div id="history-list" class="list-container"></div>
        </section>

        <!-- VISTA: CALENDARIO -->
        <section id="calendar-view" class="view">
            <button class="btn-back" onclick="showView('home-view')">← Volver</button>
            <div class="calendar-grid"></div>
        </section>

        <!-- BOTÓN FLOTANTE -->
        <button class="fab-add" onclick="abrirModal()">+</button>
    </main>

    <!-- MODAL UNIFICADO -->
    <div id="modalGenerico">
        <div class="modal-content">
            <h3>Nuevo Registro</h3>
            
            <label>¿Qué vas a agregar?</label>
            <select id="tipoEntrada">
                <option value="proyecto">Proyecto</option>
                <option value="tarea">Tarea</option>
            </select>

            <label>Nombre del trabajo:</label>
            <input type="text" id="nombreEntrada" placeholder="Ej: Laboratorio PIC18F4550">

            <label>Fecha de entrega:</label>
            <input type="date" id="fechaEntregaEntrada">

            <div class="modal-btns">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-save" onclick="guardarDatos()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
